name: Scan + Telegram
on:
  schedule:
    - cron: '15 3 * * 1-5'   # 8:45 AM IST subah yaad
    - cron: '20 10 * * 1-5'  # 3:50 PM IST market close scan
    - cron: '30 4 * * 6'     # Shanivaar 10:00 AM weekly report
    - cron: '30 4 1 * *'     # har mahine ki 1 tarikh re-check
    - cron: '*/15 4-9 * * 1-5'  # intraday alerts (9:30–15:15 IST, har ~15 min)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Kya chalana hai?'
        default: 'close'
        type: choice
        options: [close, morning, weekly, recheck, diag, intraday]
permissions:
  contents: write
concurrency:
  group: fenix
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Tests (galat code ho to yahin ruk jaye)
        run: node --test tests.mjs
      - name: Mode tay karo
        id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "15 3 * * 1-5" ]; then echo "mode=morning" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "30 4 * * 6" ]; then echo "mode=weekly" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "30 4 1 * *" ]; then echo "mode=recheck" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "*/15 4-9 * * 1-5" ]; then echo "mode=intraday" >> $GITHUB_OUTPUT
          else echo "mode=close" >> $GITHUB_OUTPUT; fi
      - name: Scan + Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scan.mjs --mode=${{ steps.m.outputs.mode }}
      - name: Data save (commit)
        if: success()
        run: |
          git config user.name "fenix-bot"
          git config user.email "fenix-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || (git commit -m "data update ${{ steps.m.outputs.mode }}" && git pull --rebase && git push)
      - name: Fail alert
        if: (failure() || cancelled()) && steps.m.outputs.mode != 'intraday'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scan.mjs --mode=fail
